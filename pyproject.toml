# pyproject.toml

# PEP 621: Standard for project metadata
[project]
name = "errorgnomark"
version = "0.1.0"
description = "A modular software suite for quantum benchmarking and characterization."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT License" }

# List of authors and their contact information
authors = [
  { name = "Chai Xudan", email = "chaixd@baqis.ac.cn" },
  # Add other contributors here if any
]

# PEP 639: Standard for license trove classifiers
keywords = ["quantum", "benchmarking", "characterization", "quantum computing", "qiskit"]

# PEP 301: Standard for package classifiers
classifiers = [
    # Development Status
    "Development Status :: 3 - Alpha",

    # Intended Audience
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",

    # License
    "License :: OSI Approved :: MIT License",

    # Supported Python Versions
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    # Topic
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# -------------------------------------------------------------------
# Core Dependencies - What the project needs to run
# Using compatible release specifiers (e.g., ~=) is a best practice.
# It allows for bug fixes and security patches but prevents breaking changes.
# -------------------------------------------------------------------
dependencies = [
    # Core scientific computing stack
    "numpy>=2.0",             # NumPy 2.0 is a major release with API cleanups. Targeting it is forward-looking.
    "scipy~=1.13",            # Compatible with SciPy 1.13.x, allows updates within the 1.x series.
    
    # Data I/O and Visualization
    "matplotlib~=3.8",        # Compatible with Matplotlib 3.8.x.
    "openpyxl~=3.1",          # For reading/writing Excel files.
    
    # Quantum Computing Framework
    "qiskit~=0.46.0"          # Pinning to a recent, stable version of Qiskit.
                              # Note: Qiskit 1.0 has been released, which is a major breaking change.
                              # If your code is not updated for Qiskit 1.0, using ~=0.46.0 is critical.
]

# -------------------------------------------------------------------
# Optional Dependencies - For developers, testing, and documentation
# Users can install these via `pip install .[dev,docs]`
# -------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    # Code Quality & Formatting
    "black~=24.4",
    "ruff~=0.4.0",
    
    # Testing Framework
    "pytest~=8.0",
    "pytest-cov~=5.0", # For checking test coverage
    
    # Dependency Analysis
    "pipreqs~=0.4.13",
    "pip-tools~=7.4",  # Excellent tool for compiling requirements files
]

docs = [
    # Documentation Generator
    "sphinx~=7.3",
    "furo~=2024.5.6", # A clean, modern Sphinx theme
    "myst-parser~=3.0", # For writing docs in Markdown
]

# Project URLs to display on PyPI
[project.urls]
# English Key      # Chinese Key (for clarity)
github = "https://github.com/BAQIS-Quantum/ErrorGnoMark"
gitee = "https://gitee.com/xdchai/errorgnomark/tree/errorgnomark-v2" # Gitee 镜像
# Build system configuration (standard for setuptools)
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"