# ===================================================================
# pyproject.toml
#
# PEP 621: Standard for modern Python project metadata.
# For more information, see: https://peps.python.org/pep-0621/
# ===================================================================

[project]
# --- Core Metadata ---
name = "ErrorGnoMark"
version = "2.0.0"
description = "A comprehensive and modular software suite for the full-stack benchmarking and characterization of quantum computing systems, from physical hardware to application-level performance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# --- People ---
# A list of authors and their contact information.
authors = [
  { name = "Chai Xudan", email = "chaixd@baqis.ac.cn" },
  { name = "Qingyuan Wu (Intern)" },
  { name = "Xingyan Fan (Intern)" },
]

# --- Classifiers & Keywords ---
# Keywords help users discover your project on PyPI.
keywords = [
    "quantum computing",
    "benchmarking",
    "characterization",
    "qcvv (Quantum Characterization, Verification, and Validation)",
    "error budget",
]

# Classifiers help users filter projects on PyPI.
# Full list: https://pypi.org/classifiers/
classifiers = [
    # 1. Development Status: Indicates the project's maturity level.
    #    - 3 - Alpha: Unstable, features may change significantly.
    #    - 4 - Beta:  Mostly stable, but may still contain bugs.
    #    - 5 - Production/Stable: Production-ready and very stable.
    "Development Status :: 3 - Alpha",

    # 2. Intended Audience: Specifies the target user base.
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    # 3. License: Specifies the project license (must match the LICENSE file).
    "License :: OSI Approved :: MIT License",

    # 4. Operating System: Indicates OS compatibility.
    "Operating System :: OS Independent", # "OS Independent" means the project is cross-platform.

    # 5. Supported Python Versions: Declares which Python versions are supported.
    #    It is a best practice to list each supported minor version.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    # 6. Topic: Categorizes the project's subject matter.
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# -------------------------------------------------------------------
# Core Dependencies - What the project needs to run.
# Using compatible release specifiers (e.g., "~=") is a best practice.
# It allows for bug fixes but prevents breaking changes.
# -------------------------------------------------------------------
dependencies = [
    # Core scientific computing and data manipulation
    "numpy~=2.3",
    "scipy~=1.16",
    "pandas~=2.3",

    # Data I/O and Visualization
    "matplotlib~=3.10",
    "seaborn~=0.13",
    "openpyxl~=3.1", # For reading/writing Excel files

    # Database and Data Validation
    "SQLAlchemy~=2.0",
    "pydantic~=2.12",

    # Utilities
    "tqdm~=4.67", # For progress bars
]

# -------------------------------------------------------------------
# Optional Dependencies - For developers, testing, and documentation.
# Users can install these via `pip install .[dev, docs]`.
# -------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    # Code Quality & Formatting
    "black~=24.4",
    "ruff~=0.4.0",

    # Testing Framework
    "pytest~=8.0",
    "pytest-cov~=5.0",

    # Dependency Management & Analysis
    "pip-tools~=7.4",   # For compiling requirements.txt from pyproject.toml
    "deptry~=0.17",     # Checks for obsolete, missing, and transitive dependencies
]

# -------------------------------------------------------------------
# Project URLs - Displayed on the PyPI project page.
# -------------------------------------------------------------------
[project.urls]
Homepage = "https://github.com/BAQIS-Quantum/ErrorGnoMark"
Repository = "https://github.com/BAQIS-Quantum/ErrorGnoMark"
Bug-Tracker = "https://github.com/BAQIS-Quantum/ErrorGnoMark/issues"
Gitee-Mirror = "https://gitee.com/xdchai/errorgnomark"

# -------------------------------------------------------------------
# Build System - Tells pip how to build the project.
# This is standard for setuptools and should generally not be changed.
# -------------------------------------------------------------------
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"